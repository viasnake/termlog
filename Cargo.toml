[package]
name = "termlog"
version = "0.1.0"
edition = "2021"
description = "Local PTY session recorder with searchable transcripts"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
vte = "0.15"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"
